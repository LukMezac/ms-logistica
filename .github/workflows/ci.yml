name: Pipeline de Integración Continua - Logística

on:
  push:
    branches: [ "main", "develop", "feature/**" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  pruebas-y-cobertura:
    name: Ejecutar Pruebas Unitarias y Validar Calidad
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout del código
        uses: actions/checkout@v4

      - name: ☕ Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: 🔑 Dar permisos a Maven
        run: chmod +x mvnw

      - name: 🧪 Ejecutar Pruebas Unitarias (Jacoco & JUnit)
        run: ./mvnw clean test

      - name: 📊 Guardar Reporte de Cobertura
        uses: actions/upload-artifact@v4
        with:
          name: reporte-cobertura-jacoco
          path: target/site/jacoco/